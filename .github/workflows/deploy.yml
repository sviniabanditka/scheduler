name: Build & Deploy

on:
  push:
    branches: [main, master]

env:
  REGISTRY: registry.sviniabanditka.com

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Login to registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build and push App
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/php/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/scheduler-app:${{ github.sha }},${{ env.REGISTRY }}/scheduler-app:latest

      - name: Build and push Solver
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./solver/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/scheduler-solver:${{ github.sha }},${{ env.REGISTRY }}/scheduler-solver:latest

      - name: Deploy to k3s
        uses: appleboy/ssh-action@v1
        with:
          host: ssh.sviniabanditka.com
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 10m
          script: |
            export KUBECONFIG=/etc/rancher/k3s/k3s.yaml
            export TAG=${{ github.sha }}
            export REGISTRY=${{ env.REGISTRY }}
            cd /tmp && rm -rf scheduler-k8s && mkdir scheduler-k8s
            cat > scheduler-k8s/kustomization.yaml << KEOF
            apiVersion: kustomize.config.k8s.io/v1beta1
            kind: Kustomization
            images:
            - name: registry.sviniabanditka.com/scheduler-app
              newTag: "${TAG}"
            - name: registry.sviniabanditka.com/scheduler-solver
              newTag: "${TAG}"
            KEOF
            kubectl -n scheduler set image deployment/scheduler-app php-fpm=${REGISTRY}/scheduler-app:${TAG}
            kubectl -n scheduler set image deployment/scheduler-app copy-app=${REGISTRY}/scheduler-app:${TAG}
            kubectl -n scheduler set image deployment/scheduler-app migrate=${REGISTRY}/scheduler-app:${TAG}
            kubectl -n scheduler set image deployment/scheduler-queue-worker queue-worker=${REGISTRY}/scheduler-app:${TAG}
            kubectl -n scheduler set image deployment/scheduler-solver solver=${REGISTRY}/scheduler-solver:${TAG}
            kubectl -n scheduler rollout status deployment/scheduler-app --timeout=300s
            kubectl -n scheduler rollout status deployment/scheduler-queue-worker --timeout=180s
            kubectl -n scheduler rollout status deployment/scheduler-solver --timeout=180s
