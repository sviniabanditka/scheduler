apiVersion: v1
kind: Service
metadata:
  name: solver
  namespace: scheduler
  labels:
    app: scheduler-solver
spec:
  ports:
    - name: http
      port: 8081
      targetPort: 8081
    - name: grpc
      port: 50051
      targetPort: 50051
  selector:
    app: scheduler-solver
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: scheduler-solver
  namespace: scheduler
spec:
  replicas: 1
  selector:
    matchLabels:
      app: scheduler-solver
  template:
    metadata:
      labels:
        app: scheduler-solver
    spec:
      containers:
        - name: solver
          image: registry.sviniabanditka.com/scheduler-solver:latest
          ports:
            - containerPort: 8081
              name: http
            - containerPort: 50051
              name: grpc
          env:
            - name: DATABASE_URL
              value: "postgres://scheduler:scheduler_prod_2024@postgres:5432/scheduler?sslmode=disable"
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "2"
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /health
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8081
            initialDelaySeconds: 10
            periodSeconds: 10
